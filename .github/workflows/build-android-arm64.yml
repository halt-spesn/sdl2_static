name: Build SDL2 Shared Libraries for Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]

    permissions:
      contents: read

    env:
      # Note: nttld/setup-ndk may install a different NDK version than requested.
      # SDL2 2.32.10+ is compatible with both NDK r26 and r27+
      ANDROID_NDK_VERSION: r26c
      SDL2_VERSION: 2.32.10
      SDL2_IMAGE_VERSION: 2.8.8
      SDL2_MIXER_VERSION: 2.8.1
      SDL2_TTF_VERSION: 2.24.0
      ANDROID_ABI: ${{ matrix.abi }}
      ANDROID_API_LEVEL: 21

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: ${{ env.ANDROID_NDK_VERSION }}
        add-to-path: true

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          ninja-build \
          pkg-config \
          wget \
          unzip \
          tar

    - name: Create build directories
      run: |
        mkdir -p build/downloads
        mkdir -p build/output/lib
        mkdir -p build/output/include

    - name: Download SDL2 sources
      run: |
        cd build/downloads
        wget -q https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz
        wget -q https://github.com/libsdl-org/SDL_image/releases/download/release-${SDL2_IMAGE_VERSION}/SDL2_image-${SDL2_IMAGE_VERSION}.tar.gz
        wget -q https://github.com/libsdl-org/SDL_mixer/releases/download/release-${SDL2_MIXER_VERSION}/SDL2_mixer-${SDL2_MIXER_VERSION}.tar.gz
        wget -q https://github.com/libsdl-org/SDL_ttf/releases/download/release-${SDL2_TTF_VERSION}/SDL2_ttf-${SDL2_TTF_VERSION}.tar.gz

    - name: Extract SDL2 sources
      run: |
        cd build/downloads
        tar -xzf SDL2-${SDL2_VERSION}.tar.gz
        tar -xzf SDL2_image-${SDL2_IMAGE_VERSION}.tar.gz
        tar -xzf SDL2_mixer-${SDL2_MIXER_VERSION}.tar.gz
        tar -xzf SDL2_ttf-${SDL2_TTF_VERSION}.tar.gz

    - name: Build SDL2
      run: |
        cd build/downloads/SDL2-${SDL2_VERSION}
        mkdir -p build-android
        cd build-android

        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ env.ANDROID_ABI }} \
          -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DSDL_STATIC=OFF \
          -DSDL_SHARED=ON \
          -DSDL_TEST=OFF \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/output \
          -GNinja

        ninja
        ninja install

    - name: Build SDL2_image
      run: |
        cd build/downloads/SDL2_image-${SDL2_IMAGE_VERSION}
        mkdir -p build-android
        cd build-android

        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ env.ANDROID_ABI }} \
          -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DSDL2IMAGE_STATIC=OFF \
          -DSDL2IMAGE_SHARED=ON \
          -DSDL2IMAGE_SAMPLES=OFF \
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/output \
          -DSDL2_DIR=${{ github.workspace }}/build/output/lib/cmake/SDL2 \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/output \
          -DSDL2IMAGE_PNG=ON \
          -DSDL2IMAGE_JPG=ON \
          -DSDL2IMAGE_WEBP=ON \
          -GNinja

        ninja
        ninja install

    - name: Build SDL2_mixer
      run: |
        cd build/downloads/SDL2_mixer-${SDL2_MIXER_VERSION}
        mkdir -p build-android
        cd build-android

        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ env.ANDROID_ABI }} \
          -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DSDL2MIXER_STATIC=OFF \
          -DSDL2MIXER_SHARED=ON \
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/output \
          -DSDL2_DIR=${{ github.workspace }}/build/output/lib/cmake/SDL2 \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/output \
          -DSDL2MIXER_VENDORED=OFF \
          -DSDL2MIXER_VORBIS=STB \
          -DSDL2MIXER_OPUS=OFF \
          -DSDL2MIXER_FLAC=OFF \
          -DSDL2MIXER_MP3_MPG123=OFF \
          -DSDL2MIXER_MOD=OFF \
          -DSDL2MIXER_MIDI=OFF \
          -DSDL2MIXER_WAVPACK=OFF \
          -DSDL2MIXER_WAVE=ON \
          -GNinja

        ninja
        ninja install

    - name: Build SDL2_ttf
      run: |
        cd build/downloads/SDL2_ttf-${SDL2_TTF_VERSION}
        mkdir -p build-android
        cd build-android

        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${{ env.ANDROID_ABI }} \
          -DANDROID_PLATFORM=android-${{ env.ANDROID_API_LEVEL }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON \
          -DSDL2TTF_STATIC=OFF \
          -DSDL2TTF_SHARED=ON \
          -DSDL2TTF_SAMPLES=OFF \
          -DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/output \
          -DSDL2_DIR=${{ github.workspace }}/build/output/lib/cmake/SDL2 \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/build/output \
          -DSDL2TTF_FREETYPE=ON \
          -GNinja

        ninja
        ninja install

    - name: Organize libraries in JNI structure
      run: |
        mkdir -p jniLibs/${{ env.ANDROID_ABI }}
        mkdir -p jniLibs/include
        
        # Copy shared libraries
        cp build/output/lib/libSDL2.so jniLibs/${{ env.ANDROID_ABI }}/
        cp build/output/lib/libSDL2_image.so jniLibs/${{ env.ANDROID_ABI }}/
        cp build/output/lib/libSDL2_mixer.so jniLibs/${{ env.ANDROID_ABI }}/
        cp build/output/lib/libSDL2_ttf.so jniLibs/${{ env.ANDROID_ABI }}/
        
        # Copy headers
        cp -r build/output/include/* jniLibs/include/
        
        echo "=== JNI Libraries Structure ==="
        tree jniLibs/ || find jniLibs/ -type f

    - name: List built libraries
      run: |
        echo "=== Built shared libraries ==="
        find jniLibs/${{ env.ANDROID_ABI }} -name "*.so" -type f
        echo ""
        echo "=== Header files ==="
        find jniLibs/include -name "*.h" -type f | head -20

    - name: Package libraries
      run: |
        tar -czf sdl2-android-${{ matrix.abi }}-jni.tar.gz jniLibs/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sdl2-android-${{ matrix.abi }}-jni
        path: sdl2-android-${{ matrix.abi }}-jni.tar.gz
        retention-days: 90

    - name: Upload library files
      uses: actions/upload-artifact@v4
      with:
        name: sdl2-android-${{ matrix.abi }}-jniLibs
        path: jniLibs/
        retention-days: 90
